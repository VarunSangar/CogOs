<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Recovery OS — Neurological Intelligence Platform</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .cro-root { min-height: 100vh; background-color: #F8FAFC; color: #0F172A; }
    .cro-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    
    // Recharts destructuring with fallback safety check
    const RechartsObj = window.Recharts || {};
    const { 
      LineChart = () => null, Line = () => null, AreaChart = () => null, Area = () => null, 
      XAxis = () => null, YAxis = () => null, CartesianGrid = () => null, 
      Tooltip = () => null, ResponsiveContainer = () => null, Legend = () => null 
    } = RechartsObj;

    /* ------------------------------------------------------------------ */
    /* STORAGE & UTILITY ENGINE                                          */
    /* ------------------------------------------------------------------ */
    const STORAGE_KEYS = {
      PROFILE: 'cro_platform_profile_v3',
      SESSIONS: 'cro_platform_sessions_v3',
      CONSENT: 'cro_platform_consent_v3',
      WEARABLES: 'cro_platform_wearables_v3'
    };

    const generateSubjectId = (profile) => {
      if (!profile) return 'NEURO_SUBJ_00000000';
      let hash = 0;
      const str = (profile.id || 'usr') + (profile.createdAt || '') + (profile.name || '');
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return `NEURO_SUBJ_${Math.abs(hash).toString(16).toUpperCase().padStart(8, '0')}`;
    };

    const avg = arr => arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

    /* ------------------------------------------------------------------ */
    /* DEMO & SYNTHETIC DATA ENGINE (LONGITUDINAL TRAJECTORY GENERATOR)  */
    /* ------------------------------------------------------------------ */
    const generateSyntheticData = () => {
      const sessions = [];
      const today = new Date();
      
      for (let i = 21; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().slice(0, 10);
        
        const recoveryFactor = (21 - i) / 21;
        const noise = () => (Math.random() - 0.5) * 0.15;

        const processingSpeed = Math.round(480 - (recoveryFactor * 130) + (noise() * 30));
        const executiveFlexibility = Math.round(65 + (recoveryFactor * 30) + (noise() * 10));
        const intraIndividualVariability = Math.round(68 - (recoveryFactor * 38) + (noise() * 12));
        const errorPatternRate = Math.round(25 - (recoveryFactor * 20) + (noise() * 5));
        const fatigueDeclineIndex = Math.round(18 - (recoveryFactor * 14) + (noise() * 4));

        const typingSpeedWpm = Math.round(42 + (recoveryFactor * 24) + (noise() * 8));
        const typingBackspaceRate = Math.round(18 - (recoveryFactor * 12) + (noise() * 4));
        const hesitationDelayMs = Math.round(380 - (recoveryFactor * 180) + (noise() * 40));
        const digitalFatigueScore = Math.round(8.2 - (recoveryFactor * 5.5) + (noise() * 1));

        const hrvMs = Math.round(32 + (recoveryFactor * 28) + (noise() * 8));
        const restingHeartRate = Math.round(72 - (recoveryFactor * 12) + (noise() * 4));
        const sleepHours = Number((6.0 + (recoveryFactor * 2.1) + (noise() * 0.8)).toFixed(1));
        const deepSleepRatio = Number((12 + (recoveryFactor * 11) + (noise() * 3)).toFixed(1));

        const headache = Math.max(0, Math.round(7.5 - (recoveryFactor * 6.5) + (noise() * 1.5)));
        const dizziness = Math.max(0, Math.round(6.0 - (recoveryFactor * 5.5) + (noise() * 1.5)));
        const cognitiveFatigue = Math.max(0, Math.round(8.0 - (recoveryFactor * 6.8) + (noise() * 1.5)));
        const sensorySensitivity = Math.max(0, Math.round(6.5 - (recoveryFactor * 5.8) + (noise() * 1.5)));
        const symptomBurden = Number(((headache + dizziness + cognitiveFatigue + sensorySensitivity) / 4).toFixed(1));

        const valid = intraIndividualVariability < 75 && errorPatternRate < 40;

        sessions.push({
          id: `SESS_${dateStr}`,
          date: dateStr,
          timestamp: date.toISOString(),
          valid,
          validityScore: valid ? 95 - Math.round(noise() * 10) : 45,
          cognitive: {
            processingSpeed,
            executiveFlexibility,
            intraIndividualVariability,
            errorPatternRate,
            fatigueDeclineIndex
          },
          behavioral: {
            typingSpeedWpm,
            typingBackspaceRate,
            hesitationDelayMs,
            digitalFatigueScore
          },
          physiological: {
            hrvMs,
            restingHeartRate,
            sleepHours,
            deepSleepRatio,
            source: i % 2 === 0 ? 'Apple HealthKit' : 'Oura API'
          },
          symptoms: {
            headache,
            dizziness,
            cognitiveFatigue,
            sensorySensitivity,
            symptomBurden
          }
        });
      }
      return sessions;
    };

    /* ------------------------------------------------------------------ */
    /* AI INSIGHT SYNTHESIS ENGINE                                       */
    /* ------------------------------------------------------------------ */
    const synthesizeNeurologicalInsights = (sessions) => {
      if (!sessions || sessions.length < 3) return [];
      const insights = [];
      const recent = sessions[sessions.length - 1];
      const baseline = sessions.slice(0, 5);

      const baseSpeed = avg(baseline.map(s => s.cognitive.processingSpeed));
      const recentSpeed = recent.cognitive.processingSpeed;
      const speedDiffPct = Math.round(((baseSpeed - recentSpeed) / baseSpeed) * 100);

      if (speedDiffPct > 15) {
        insights.push({
          type: 'positive',
          category: 'Cognitive Trajectory',
          title: 'Meaningful Speed Recovery',
          description: `Processing speed has improved by ${speedDiffPct}% relative to post-disruption baseline (current: ${recentSpeed}ms vs baseline: ${Math.round(baseSpeed)}ms).`
        });
      }

      const lowSleepDays = sessions.filter(s => s.physiological.sleepHours < 6.5);
      if (lowSleepDays.length > 0) {
        const avgSpeedLowSleep = avg(lowSleepDays.map(s => s.cognitive.processingSpeed));
        const normalSleepDays = sessions.filter(s => s.physiological.sleepHours >= 6.5);
        const avgSpeedNormalSleep = avg(normalSleepDays.map(s => s.cognitive.processingSpeed));
        
        if (avgSpeedLowSleep > avgSpeedNormalSleep + 25) {
          insights.push({
            type: 'warning',
            category: 'Symptom-Physiology Interaction',
            title: 'Sleep Vulnerability Detected',
            description: `Processing speed delays average +${Math.round(avgSpeedLowSleep - avgSpeedNormalSleep)}ms on days following < 6.5h sleep duration.`
          });
        }
      }

      if (recent.behavioral.typingBackspaceRate > 15 && recent.cognitive.fatigueDeclineIndex > 12) {
        insights.push({
          type: 'neutral',
          category: 'Behavioral Biomarker',
          title: 'Digital Fatigue Signal',
          description: `High typing backspace rates (${recent.behavioral.typingBackspaceRate}%) correlate with end-of-session cognitive fatigue decay.`
        });
      }

      return insights;
    };

    /* ------------------------------------------------------------------ */
    /* CONSENT MODAL                                                      */
    /* ------------------------------------------------------------------ */
    const PlatformConsentModal = ({ onAccept }) => {
      const [agreed, setAgreed] = useState(false);

      return (
        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-xl w-full p-8 shadow-2xl border border-slate-200">
            <div className="flex items-center gap-3 mb-6">
              <div className="p-3 bg-teal-600 text-white rounded-xl shadow-md">
                <i data-lucide="brain-circuit" className="w-7 h-7"></i>
              </div>
              <div>
                <h2 className="text-xl font-bold text-slate-900">Cognitive Recovery OS</h2>
                <p className="text-xs text-teal-700 font-semibold tracking-wide uppercase">Neurological Recovery Intelligence Platform</p>
              </div>
            </div>
            
            <div className="text-sm text-slate-600 space-y-3.5 max-h-64 overflow-y-auto pr-2 mb-6 border-y border-slate-100 py-4">
              <p><strong>1. Research Architecture Notice:</strong> Cognitive Recovery OS continuously aggregates longitudinal cognitive, behavioral, physiological, and symptom signals to map post-disruption brain trajectory.</p>
              <p><strong>2. Non-Diagnostic Infrastructure:</strong> This system is an outcomes-linked monitoring platform. It does not provide clinical diagnoses, medical prognosis, or return-to-activity clearance.</p>
              <p><strong>3. Multi-Layer Biomarker Consent:</strong> Interactive assessments evaluate processing speed, executive flexibility, error patterns, and motor hesitation.</p>
              <p><strong>4. IRB-Ready De-identification:</strong> Exported research files automatically strip all Direct Health Identifiers (PHI).</p>
            </div>

            <label className="flex items-start gap-3 mb-6 cursor-pointer select-none">
              <input 
                type="checkbox" 
                checked={agreed} 
                onChange={(e) => setAgreed(e.target.checked)}
                className="mt-1 h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500" 
              />
              <span className="text-xs text-slate-700 leading-relaxed">
                I acknowledge the non-diagnostic research position of this platform and consent to longitudinal multi-layer data logging.
              </span>
            </label>

            <button
              disabled={!agreed}
              onClick={onAccept}
              className={`w-full py-3.5 rounded-xl font-semibold text-white transition shadow-sm ${
                agreed ? 'bg-teal-700 hover:bg-teal-800 shadow-teal-700/20' : 'bg-slate-300 cursor-not-allowed'
              }`}
            >
              Initialize Intelligence Engine
            </button>
          </div>
        </div>
      );
    };

    /* ------------------------------------------------------------------ */
    /* MAIN PLATFORM APPLICATION                                         */
    /* ------------------------------------------------------------------ */
    const App = () => {
      const [consentGiven, setConsentGiven] = useState(() => !!localStorage.getItem(STORAGE_KEYS.CONSENT));
      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.PROFILE);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [sessions, setSessions] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.SESSIONS);
          return saved ? JSON.parse(saved) : generateSyntheticData();
        } catch (e) {
          return generateSyntheticData();
        }
      });
      const [activeTab, setActiveTab] = useState('longitudinal');

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      });

      const handleAcceptConsent = () => {
        localStorage.setItem(STORAGE_KEYS.CONSENT, 'true');
        setConsentGiven(true);
      };

      const handleSetupProfile = (e) => {
        e.preventDefault();
        const form = e.target;
        const newProfile = {
          id: 'usr_' + Math.random().toString(36).substr(2, 9),
          name: form.name.value,
          age: parseInt(form.age.value, 10),
          disruptionType: form.disruptionType.value,
          recoveryStage: form.stage.value,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(newProfile));
        setProfile(newProfile);
      };

      const handleLoadDemo = () => {
        const data = generateSyntheticData();
        localStorage.setItem(STORAGE_KEYS.SESSIONS, JSON.stringify(data));
        setSessions(data);
      };

      const handleClearData = () => {
        localStorage.removeItem(STORAGE_KEYS.SESSIONS);
        setSessions([]);
      };

      const exportIRBDataset = () => {
        if (!sessions.length) return;
        const subjectId = generateSubjectId(profile);
        const headers = [
          "subject_id", "session_id", "timestamp", "valid", "validity_score",
          "cog_processing_speed_ms", "cog_executive_flexibility_pct", "cog_rt_variability_sd", "cog_error_rate_pct", "cog_fatigue_decay",
          "beh_typing_wpm", "beh_backspace_rate", "beh_hesitation_delay_ms",
          "physio_hrv_ms", "physio_resting_hr", "physio_sleep_hours", "physio_deep_sleep_pct",
          "sym_headache", "sym_dizziness", "sym_cognitive_fatigue", "sym_sensory_sensitivity", "sym_total_burden"
        ].join(",") + "\n";

        const rows = sessions.map(s => [
          subjectId, s.id, s.timestamp, s.valid ? 1 : 0, s.validityScore,
          s.cognitive.processingSpeed, s.cognitive.executiveFlexibility, s.cognitive.intraIndividualVariability, s.cognitive.errorPatternRate, s.cognitive.fatigueDeclineIndex,
          s.behavioral.typingSpeedWpm, s.behavioral.typingBackspaceRate, s.behavioral.hesitationDelayMs,
          s.physiological.hrvMs, s.physiological.restingHeartRate, s.physiological.sleepHours, s.physiological.deepSleepRatio,
          s.symptoms.headache, s.symptoms.dizziness, s.symptoms.cognitiveFatigue, s.symptoms.sensorySensitivity, s.symptoms.symptomBurden
        ].join(",")).join("\n");

        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${subjectId}_IRB_Longitudinal_Dataset.csv`;
        a.click();
      };

      const insights = useMemo(() => synthesizeNeurologicalInsights(sessions), [sessions]);

      if (!consentGiven) return <PlatformConsentModal onAccept={handleAcceptConsent} />;

      if (!profile) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
            <form onSubmit={handleSetupProfile} className="bg-white p-8 rounded-2xl border border-slate-200 max-w-md w-full shadow-xl">
              <div className="flex items-center gap-3 mb-6">
                <div className="p-2.5 bg-teal-700 text-white rounded-lg">
                  <i data-lucide="brain" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">Participant Intake</h1>
                  <p className="text-xs text-slate-500">Initialize neurological baseline record</p>
                </div>
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Participant / Anonymous Identifier</label>
                  <input name="name" required className="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-teal-600 outline-none" placeholder="e.g. Subj-8021" />
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Age</label>
                  <input name="age" type="number" required defaultValue="26" className="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-teal-600 outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Disruption Classification</label>
                  <select name="disruptionType" className="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-teal-600 outline-none">
                    <option value="concussion">Sports / Mild TBI</option>
                    <option value="post_viral">Post-Viral / Neuro-Fatigue</option>
                    <option value="sleep_deprivation">Sleep Disruption Protocol</option>
                    <option value="general_baseline">General Recovery Baseline</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">Recovery Phase</label>
                  <select name="stage" className="w-full p-2.5 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-teal-600 outline-none">
                    <option value="acute">Acute Phase (&lt; 14 days)</option>
                    <option value="subacute">Subacute Phase (2 - 6 weeks)</option>
                    <option value="persistent">Persistent Symptoms (&gt; 6 weeks)</option>
                    <option value="return_to_activity">Return to Activity Monitoring</option>
                  </select>
                </div>
                <button type="submit" className="w-full py-3 bg-teal-700 text-white font-semibold rounded-lg hover:bg-teal-800 transition shadow-sm">
                  Initialize Baseline Profile
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F8FAFC]">
          {/* Sidebar Navigation */}
          <aside className="w-full md:w-72 bg-white border-r border-slate-200 p-6 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-9 h-9 rounded-xl bg-teal-700 flex items-center justify-center text-white font-bold shadow-md">
                  <i data-lucide="brain-circuit" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-bold text-slate-900 tracking-tight block leading-none">Cognitive Recovery</span>
                  <span className="text-[10px] text-teal-700 font-bold uppercase tracking-wider">Intelligence OS</span>
                </div>
              </div>

              <nav className="space-y-1.5">
                {[
                  { id: 'longitudinal', label: 'Recovery Trajectory', icon: 'trending-up' },
                  { id: 'cognitive', label: 'Cognitive Multi-Layer', icon: 'cpu' },
                  { id: 'behavioral', label: 'Behavioral Biomarkers', icon: 'mouse-pointer' },
                  { id: 'physiological', label: 'Physiology & Wearables', icon: 'heart-pulse' },
                  { id: 'symptoms', label: 'Symptom Intelligence', icon: 'activity' },
                  { id: 'research', label: 'Research & IRB Export', icon: 'flask-conical' },
                  { id: 'clinician', label: 'Clinician Dashboard', icon: 'stethoscope' }
                ].map(item => (
                  <button 
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
                      activeTab === item.id 
                        ? 'bg-teal-50 text-teal-800 border border-teal-100 shadow-sm' 
                        : 'text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="border-t border-slate-100 pt-5 mt-6 space-y-3">
              <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Subject Identifier</div>
                <div className="text-xs font-mono font-semibold text-slate-700 mt-0.5 truncate">{generateSubjectId(profile)}</div>
              </div>
              <div className="flex gap-2">
                <button onClick={handleLoadDemo} className="flex-1 py-1.5 bg-slate-100 text-slate-700 text-[11px] font-semibold rounded-lg hover:bg-slate-200">
                  Reload Synthetic Arc
                </button>
                <button onClick={handleClearData} className="px-2 py-1.5 bg-rose-50 text-rose-700 text-[11px] font-semibold rounded-lg hover:bg-rose-100">
                  Clear
                </button>
              </div>
            </div>
          </aside>

          {/* Main Workspace Area */}
          <main className="flex-1 p-6 md:p-10 max-w-6xl">
            {/* TOP HEADER */}
            <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
              <div>
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">
                  {activeTab === 'longitudinal' && 'Longitudinal Recovery Trajectory'}
                  {activeTab === 'cognitive' && 'Multi-Dimensional Cognitive Metrics'}
                  {activeTab === 'behavioral' && 'Passive Behavioral Biomarkers'}
                  {activeTab === 'physiological' && 'Physiological Integration Layer'}
                  {activeTab === 'symptoms' && 'Symptom & Cross-Domain Intelligence'}
                  {activeTab === 'research' && 'Research Dataset & IRB Export'}
                  {activeTab === 'clinician' && 'Clinical Remote Monitoring Overview'}
                </h1>
                <p className="text-xs text-slate-500 mt-1">
                  Measuring post-disruption neurological change relative to intra-individual baselines.
                </p>
              </div>

              <div className="flex items-center gap-3">
                <span className="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold rounded-full flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Non-Diagnostic OS
                </span>
                <button 
                  onClick={exportIRBDataset}
                  className="px-3.5 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold hover:bg-slate-800 flex items-center gap-2 shadow-sm"
                >
                  <i data-lucide="download" className="w-3.5 h-3.5"></i> Export Dataset
                </button>
              </div>
            </header>

            {/* TAB 1: LONGITUDINAL TRAJECTORY */}
            {activeTab === 'longitudinal' && (
              <div className="space-y-6">
                {insights.length > 0 && (
                  <div className="space-y-3">
                    {insights.map((insight, idx) => (
                      <div key={idx} className={`p-4 rounded-xl border flex items-start gap-3 ${
                        insight.type === 'positive' ? 'bg-emerald-50/60 border-emerald-200 text-emerald-900' :
                        insight.type === 'warning' ? 'bg-amber-50/60 border-amber-200 text-amber-900' : 'bg-slate-50 border-slate-200 text-slate-900'
                      }`}>
                        <i data-lucide={insight.type === 'positive' ? 'trending-up' : 'alert-circle'} className="w-5 h-5 mt-0.5 shrink-0"></i>
                        <div>
                          <div className="text-xs font-bold uppercase tracking-wide opacity-75">{insight.category}</div>
                          <div className="text-sm font-bold mt-0.5">{insight.title}</div>
                          <div className="text-xs mt-1 opacity-90">{insight.description}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">Processing Speed Trajectory & Stability (ms)</h3>
                      <p className="text-xs text-slate-500">21-day trajectory slope vs intra-individual variance floor</p>
                    </div>
                    <span className="text-xs font-mono font-semibold px-2.5 py-1 bg-teal-50 text-teal-800 rounded-md">RCI Engine Active</span>
                  </div>

                  <div className="h-72">
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={sessions}>
                        <defs>
                          <linearGradient id="colorSpeed" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor="#0C7B7B" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#0C7B7B" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                        <XAxis dataKey="date" tick={{fontSize: 11}} />
                        <YAxis domain={['dataMin - 20', 'dataMax + 20']} tick={{fontSize: 11}} />
                        <Tooltip />
                        <Area type="monotone" dataKey="cognitive.processingSpeed" stroke="#0C7B7B" strokeWidth={2.5} fillOpacity={1} fill="url(#colorSpeed)" name="Processing Speed (ms)" />
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Recovery Slope</span>
                    <div className="text-2xl font-bold text-emerald-600 mt-1">+23.4%</div>
                    <p className="text-xs text-slate-500 mt-1">21-day longitudinal trajectory velocity</p>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Attention Stability</span>
                    <div className="text-2xl font-bold text-slate-800 mt-1">SD ±28ms</div>
                    <p className="text-xs text-amber-600 mt-1">Elevated intra-individual variability</p>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Session Validity Rate</span>
                    <div className="text-2xl font-bold text-slate-900 mt-1">95.4%</div>
                    <p className="text-xs text-slate-500 mt-1">Filtered by effort & false-alarm algorithms</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: MULTI-DIMENSIONAL COGNITIVE METRICS */}
            {activeTab === 'cognitive' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-1">Executive Flexibility & Switch Accuracy (%)</h3>
                    <p className="text-xs text-slate-500 mb-4">Set-shifting response efficiency under cognitive load</p>
                    <div className="h-60">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={sessions}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                          <XAxis dataKey="date" tick={{fontSize: 10}} />
                          <YAxis domain={[40, 100]} tick={{fontSize: 10}} />
                          <Tooltip />
                          <Line type="monotone" dataKey="cognitive.executiveFlexibility" stroke="#2563EB" strokeWidth={2} name="Flexibility (%)" />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-1">Fatigue-Related Cognitive Decay (%)</h3>
                    <p className="text-xs text-slate-500 mb-4">Block 1 vs Block 4 response latency degradation</p>
                    <div className="h-60">
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={sessions}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                          <XAxis dataKey="date" tick={{fontSize: 10}} />
                          <YAxis tick={{fontSize: 10}} />
                          <Tooltip />
                          <Line type="monotone" dataKey="cognitive.fatigueDeclineIndex" stroke="#DC2626" strokeWidth={2} name="Fatigue Decay (%)" />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: PASSIVE BEHAVIORAL BIOMARKERS */}
            {activeTab === 'behavioral' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-900 mb-1">Typing Micro-Fluency & Backspace Error Pattern</h3>
                  <p className="text-xs text-slate-500 mb-4">Passive keystroke speed (WPM) vs hesitation correction frequency</p>
                  <div className="h-64">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={sessions}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                        <XAxis dataKey="date" tick={{fontSize: 10}} />
                        <YAxis yAxisId="left" tick={{fontSize: 10}} />
                        <YAxis yAxisId="right" orientation="right" tick={{fontSize: 10}} />
                        <Tooltip />
                        <Line yAxisId="left" type="monotone" dataKey="behavioral.typingSpeedWpm" stroke="#0D9488" strokeWidth={2} name="Speed (WPM)" />
                        <Line yAxisId="right" type="monotone" dataKey="behavioral.typingBackspaceRate" stroke="#D97706" strokeWidth={2} name="Backspace Rate (%)" />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: PHYSIOLOGICAL INTEGRATION LAYER */}
            {activeTab === 'physiological' && (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-3">
                      <div className="p-2.5 bg-teal-500/20 text-teal-400 rounded-xl">
                        <i data-lucide="heart-pulse" className="w-6 h-6"></i>
                      </div>
                      <div>
                        <h3 className="text-base font-bold">Wearable API Integration Layer</h3>
                        <p className="text-xs text-slate-400">Schema-compatible with Apple HealthKit, Fitbit, Oura, WHOOP</p>
                      </div>
                    </div>
                    <span className="px-3 py-1 bg-teal-500/20 text-teal-300 text-xs font-mono font-semibold rounded-full">
                      API Plug-In Ready
                    </span>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 border-t border-slate-800">
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-bold">Latest HRV (rMSSD)</div>
                      <div className="text-xl font-bold text-teal-400 mt-0.5">{sessions[sessions.length - 1]?.physiological.hrvMs || 0} ms</div>
                    </div>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-bold">Resting Heart Rate</div>
                      <div className="text-xl font-bold text-slate-200 mt-0.5">{sessions[sessions.length - 1]?.physiological.restingHeartRate || 0} bpm</div>
                    </div>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-bold">Sleep Duration</div>
                      <div className="text-xl font-bold text-slate-200 mt-0.5">{sessions[sessions.length - 1]?.physiological.sleepHours || 0} hrs</div>
                    </div>
                    <div>
                      <div className="text-[10px] text-slate-400 uppercase font-bold">Deep Sleep Ratio</div>
                      <div className="text-xl font-bold text-teal-400 mt-0.5">{sessions[sessions.length - 1]?.physiological.deepSleepRatio || 0} %</div>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-900 mb-1">Heart Rate Variability (HRV) Trajectory</h3>
                  <p className="text-xs text-slate-500 mb-4">Autonomic nervous system recovery signal</p>
                  <div className="h-60">
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={sessions}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                        <XAxis dataKey="date" tick={{fontSize: 10}} />
                        <YAxis tick={{fontSize: 10}} />
                        <Tooltip />
                        <Area type="monotone" dataKey="physiological.hrvMs" stroke="#0D9488" fill="#CCFBF1" strokeWidth={2} name="HRV (ms)" />
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SYMPTOM INTELLIGENCE LAYER */}
            {activeTab === 'symptoms' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-900 mb-1">Multi-Domain Symptom Trajectories</h3>
                  <p className="text-xs text-slate-500 mb-4">Headache, Dizziness, Fatigue & Sensory burden trends</p>
                  <div className="h-64">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={sessions}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                        <XAxis dataKey="date" tick={{fontSize: 10}} />
                        <YAxis domain={[0, 10]} tick={{fontSize: 10}} />
                        <Tooltip />
                        <Line type="monotone" dataKey="symptoms.headache" stroke="#EF4444" strokeWidth={2} name="Headache" />
                        <Line type="monotone" dataKey="symptoms.dizziness" stroke="#F59E0B" strokeWidth={2} name="Dizziness" />
                        <Line type="monotone" dataKey="symptoms.cognitiveFatigue" stroke="#8B5CF6" strokeWidth={2} name="Cognitive Fatigue" />
                        <Line type="monotone" dataKey="symptoms.sensorySensitivity" stroke="#06B6D4" strokeWidth={2} name="Sensory Sensitivity" />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: RESEARCH INFRASTRUCTURE */}
            {activeTab === 'research' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">Research & IRB Protocol Export Engine</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Generate de-identified datasets structured for machine learning models and academic studies.</p>
                </div>

                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 font-mono text-xs text-slate-700 space-y-2">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Anonymized Hash Identifier:</span>
                    <span className="font-bold">{generateSubjectId(profile)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Total Longitudinal Records:</span>
                    <span className="font-bold">{sessions.length} sessions</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">PHI Compliance Status:</span>
                    <span className="font-bold text-emerald-600">Zero Direct Identifiers (De-Identified)</span>
                  </div>
                </div>

                <button 
                  onClick={exportIRBDataset}
                  className="px-6 py-3 bg-teal-700 text-white font-semibold rounded-xl hover:bg-teal-800 transition flex items-center gap-2 shadow-sm"
                >
                  <i data-lucide="download" className="w-4 h-4"></i> Download Standardized IRB Research CSV
                </button>
              </div>
            )}

            {/* TAB 7: CLINICIAN DASHBOARD */}
            {activeTab === 'clinician' && (
              <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Clinical Remote Monitoring Overview</h2>
                    <p className="text-xs text-slate-500">Summary view designed for physician/physiotherapist progress reviews</p>
                  </div>
                  <span className="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 text-xs font-semibold rounded-lg">
                    Remote Monitoring Workflow
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <h4 className="text-xs font-bold text-slate-500 uppercase">Current Recovery Status</h4>
                    <div className="text-xl font-bold text-slate-900 mt-1">Subacute Improvement Arc</div>
                    <p className="text-xs text-slate-600 mt-2">
                      Cognitive speed is steadily normalizing (+23% over 3 weeks). Attention variability remains slightly elevated following high-exertion days.
                    </p>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <h4 className="text-xs font-bold text-slate-500 uppercase">Recommended Focus</h4>
                    <div className="text-xl font-bold text-teal-800 mt-1">Cognitive Pace Management</div>
                    <p className="text-xs text-slate-600 mt-2">
                      Cross-domain logs suggest pacing sleep duration &gt; 7.0h prevents multi-task processing speed drops.
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    };

    // Safe DOM Mount for React 18
    const rootElement = document.getElementById('root');
    if (rootElement) {
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootElement).render(<App />);
      } else {
        ReactDOM.render(<App />, rootElement);
      }
    }
  </script>
</body>
</html>
