<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Recovery OS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div id="root">
    <div class="p-8 text-center text-slate-500">
      Loading Cognitive Recovery OS... If this remains, check browser console.
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Mock Data Generator ---
    const generateSyntheticData = () => {
      const data = [];
      const today = new Date();
      for (let i = 14; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const progress = (14 - i) / 14;
        data.push({
          date: d.toISOString().slice(5, 10),
          processingSpeed: Math.round(480 - progress * 120 + (Math.random() - 0.5) * 20),
          flexibility: Math.round(60 + progress * 30 + (Math.random() - 0.5) * 10),
          fatigue: Math.round(20 - progress * 12 + (Math.random() - 0.5) * 5)
        });
      }
      return data;
    };

    // --- Inline SVG Sparkline / Visual Component ---
    const SimpleChart = ({ data, dataKey, color, label, unit }) => {
      const values = data.map(d => d[dataKey]);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      
      const points = values.map((val, idx) => {
        const x = (idx / (values.length - 1)) * 100;
        const y = 100 - ((val - min) / range) * 80 - 10;
        return `${x},${y}`;
      }).join(" ");

      const latest = values[values.length - 1];

      return (
        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div className="flex justify-between items-center mb-3">
            <div>
              <h3 className="text-sm font-bold text-slate-800">{label}</h3>
              <p className="text-xs text-slate-500">14-Day Trajectory</p>
            </div>
            <div className="text-right">
              <span className="text-xl font-bold" style={{ color }}>{latest}</span>
              <span className="text-xs text-slate-400 ml-1">{unit}</span>
            </div>
          </div>
          
          <div className="h-28 w-full">
            <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible" preserveAspectRatio="none">
              <polyline
                fill="none"
                stroke={color}
                strokeWidth="3"
                points={points}
                vectorEffect="non-scaling-stroke"
              />
            </svg>
          </div>
          <div className="flex justify-between text-[10px] text-slate-400 mt-2">
            <span>{data[0]?.date}</span>
            <span>{data[data.length - 1]?.date}</span>
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      const [sessions, setSessions] = useState([]);
      const [activeTab, setActiveTab] = useState('overview');

      useEffect(() => {
        setSessions(generateSyntheticData());
      }, []);

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* Sidebar */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between shrink-0">
            <div>
              <div className="flex items-center gap-2 mb-8">
                <div className="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center text-white font-bold text-sm">
                  CR
                </div>
                <div>
                  <h1 className="font-bold text-sm leading-tight">Cognitive OS</h1>
                  <p className="text-[10px] text-teal-400">Recovery Platform</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'overview', label: 'Recovery Overview' },
                  { id: 'metrics', label: 'Cognitive Metrics' },
                  { id: 'export', label: 'Data & Export' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition ${
                      activeTab === item.id 
                        ? 'bg-teal-600 text-white' 
                        : 'text-slate-400 hover:text-white hover:bg-slate-800'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="mt-8 pt-4 border-t border-slate-800 text-[11px] text-slate-500">
              Status: <span className="text-emerald-400 font-semibold">Active</span>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 p-6 md:p-8 max-w-5xl">
            <header className="mb-6 flex justify-between items-center">
              <div>
                <h2 className="text-xl font-bold text-slate-900">
                  {activeTab === 'overview' && 'Longitudinal Recovery Dashboard'}
                  {activeTab === 'metrics' && 'Detailed Cognitive Breakdown'}
                  {activeTab === 'export' && 'Research Export Protocol'}
                </h2>
                <p className="text-xs text-slate-500">Non-Diagnostic Research Dashboard</p>
              </div>
              <button 
                onClick={() => setSessions(generateSyntheticData())} 
                className="px-3 py-1.5 bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-300"
              >
                Refresh Data
              </button>
            </header>

            {activeTab === 'overview' && (
              <div className="space-y-6">
                <div className="p-4 bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl text-xs">
                  <strong>Positive Trend Detected:</strong> Reaction processing latency improved by 21% over the last 14 sessions.
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <SimpleChart 
                    data={sessions} 
                    dataKey="processingSpeed" 
                    color="#0C7B7B" 
                    label="Processing Speed (Reaction Time)" 
                    unit="ms" 
                  />
                  <SimpleChart 
                    data={sessions} 
                    dataKey="flexibility" 
                    color="#2563EB" 
                    label="Executive Set-Shifting" 
                    unit="%" 
                  />
                </div>
              </div>
            )}

            {activeTab === 'metrics' && (
              <div className="space-y-4">
                <SimpleChart 
                  data={sessions} 
                  dataKey="fatigue" 
                  color="#DC2626" 
                  label="End-of-Session Fatigue Index" 
                  unit="%" 
                />
              </div>
            )}

            {activeTab === 'export' && (
              <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-4">
                <h3 className="text-sm font-bold text-slate-900">Export Raw Dataset</h3>
                <p className="text-xs text-slate-500">
                  Export session trajectory as a standard CSV file for further statistical analysis.
                </p>
                <button 
                  onClick={() => {
                    const csvStr = "date,processing_speed_ms,flexibility_pct,fatigue_pct\n" + 
                      sessions.map(s => `${s.date},${s.processingSpeed},${s.flexibility},${s.fatigue}`).join("\n");
                    const blob = new Blob([csvStr], { type: 'text/csv' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "cognitive_recovery_data.csv";
                    a.click();
                  }}
                  className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800"
                >
                  Download CSV
                </button>
              </div>
            )}
          </main>
        </div>
      );
    };

    // Render React App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
